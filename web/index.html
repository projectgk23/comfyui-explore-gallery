<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Gallery</title>
<link rel="stylesheet" href="/explore_gallery/web/style.css">
</head>
<body>
<header>
  <div class="row" id="tabs"></div>
  <div class="row toolbar">
    <button id="reload">🔄 再読み込み</button>
    <label class="flbl chk" title="新着画像を自動で取り込む">
      <input type="checkbox" id="autorefresh"> 自動更新
    </label>
    <button id="dlfolder">⬇ フォルダZIP</button>
    <button id="prunecache" title="未使用のサムネキャッシュ（孤児・残骸）を削除し、上限超過分も整理">🧹 キャッシュ整理</button>
    <span class="grow"></span>
    <span id="count">0 / 0</span>
  </div>
  <div class="row selbar" id="selbar" hidden>
    <span id="selinfo">0 枚選択中</span>
    <button id="all">全選択</button>
    <button id="none">全解除</button>
    <span class="sep"></span>
    <label class="flbl" id="dstwrap">移動先
      <select id="dstsel"></select>
    </label>
    <button id="move" class="primary">→ 移動</button>
    <button id="dl">⬇ DL</button>
    <button id="del" class="danger">🗑 ゴミ箱へ</button>
  </div>
  <div class="row filters">
    <input id="search" type="search" placeholder="🔍 ファイル名で検索…" autocomplete="off">
    <label class="flbl chk" title="プロンプト・モデル名・シードなど埋め込み情報も検索（やや時間がかかります）">
      <input type="checkbox" id="metasearch"> メタも検索
    </label>
    <label class="flbl">並び替え
      <select id="sortkey">
        <option value="mtime">日時</option>
        <option value="name">名前</option>
        <option value="size">サイズ</option>
      </select>
    </label>
    <button id="sortdir" title="昇順 / 降順">▼</button>
    <span class="sep"></span>
    <label class="flbl">表示
      <select id="thumbsize">
        <option value="140">小</option>
        <option value="190">中</option>
        <option value="260">大</option>
      </select>
    </label>
  </div>
</header>
<div id="grid"></div>
<div id="empty" hidden>このフォルダに画像がありません。</div>

<div id="lb">
  <div class="stage">
    <button class="nav prev" id="lbprev">‹</button>
    <div class="imgwrap">
      <img id="lbimg" alt="" draggable="false">
      <div class="lbtools">
        <button id="lbinfo" title="メタデータ">ℹ</button>
        <button id="lbcopy" title="ワークフローをコピー（ComfyUIで Ctrl+V）">📋</button>
        <button id="lbsel" class="selbtn" title="選択トグル">✓</button>
        <button id="lbdl" title="ダウンロード">⬇</button>
        <button id="lbclose" title="閉じる">✕</button>
      </div>
      <div id="lbcap"></div>
    </div>
    <aside id="lbmeta" hidden></aside>
    <button class="nav next" id="lbnext">›</button>
  </div>
  <div class="film">
    <div class="filminfo">
      <span id="lbpos">0 / 0</span>
      <span class="legend"><kbd>←</kbd><kbd>→</kbd> 送り　<kbd>↑</kbd> 選択　<kbd>↓</kbd> ゴミ箱　<kbd>i</kbd> 情報　<kbd>c</kbd> WFコピー　ホイール 拡大　<kbd>Esc</kbd> 閉じる</span>
    </div>
    <div class="filmstrip" id="lbstrip"></div>
  </div>
</div>

<div id="dropzone" hidden>
  <div class="dzbox">📥 「<span class="dz-folder"></span>」にアップロード
    <small>ここにドロップして画像を追加</small></div>
</div>

<div id="toasts"></div>

<script src="/explore_gallery/web/app.js"></script>
</body>
</html>
